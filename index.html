<!DOCTYPE html>

<html>
<head>
	<title>Tic Tac BOB</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	
	<div id="cursor"></div>
	
	<h1>SWORD ONLY ACCURATE TIERLIST</h1>
	
	<div class="tab">
	
		<div onclick="window.location.href='index.html';" class="tab-gamemode">OVERALL</div>
	
		<div onclick="window.location.href='sword-ranking.html';" class="tab-gamemode">
			<img alt="minecraft sword indicating the gamemode" src="sword.jpg" class="gamemode-image"></img>
		</div>
		
	
		<div class="player">
			<img alt="speedrun1's minecraft head" src="https://minotar.net/avatar/speedrun1" class="player-head"></img>
			<p>speedrun1</p>
			<h5 style="position: relative; top: -3px">HT1</h5>
			<img alt="small sword for ranking" src="sword.jpg" class="small-ranking-img"><img>
			
			<h2 class="placement" style="position: relative; left: 700px; top: -5px;"></h2>
		</div>
		
	</div>

	<script src="script.js" defer></script>
</body>
</html>
