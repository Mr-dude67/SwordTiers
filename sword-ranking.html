<!DOCTYPE html>

<html>
<head>
	<title>Tic Tac BOB</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	
	<div id="cursor"></div>
	
	<h1>SWORD ONLY ACCURATE TIERLIST</h1>
	
	<div class="tab">
	
		<div onclick="window.location.href='index.html';" class="tab-gamemode">OVERALL</div>
	
		<div onclick="window.location.href='sword-ranking.html';" class="tab-gamemode">
			<img alt="minecraft sword indicating the gamemode" src="sword.jpg" class="gamemode-image"></img>
		</div>
		
		<div class="tier-box-holder-holder">
			<div id="tier1" class="tier-box-holder">
				<div class="tier-box">
					<h2>TIER 1</h2>
				</div>
			</div>
			
			<div id="tier2" class="tier-box-holder">
				<div class="tier-box">
					<h2>TIER 2</h2>
				</div>
			</div>
			
			<div id="tier3" class="tier-box-holder">
				<div class="tier-box">
					<h2>TIER 3</h2>
				</div>
			</div>
			
			<div id="tier4"class="tier-box-holder">
				<div class="tier-box">
					<h2>TIER 4</h2>
				</div>
			</div>
			
			<div id="tier5" class="tier-box-holder">
				<div class="tier-box">
					<h2>TIER 5</h2>
				</div>
			</div>
		</div>
		
	</div>

	<script src="sword-ranking.js" defer></script>
</body>
</html>
